name: Update Netcraze stock

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install browser
        run: |
          npm install --no-save playwright@1.54.2
          npx playwright install --with-deps chromium

      - name: Collect current stock
        env:
          SOURCE_CATALOG_URL: ${{ secrets.SOURCE_CATALOG_URL }}
          SOURCE_LOGIN_URL: ${{ secrets.SOURCE_LOGIN_URL }}
          SOURCE_LOGIN: ${{ secrets.SOURCE_LOGIN }}
          SOURCE_PASSWORD: ${{ secrets.SOURCE_PASSWORD }}
        run: node scripts/scrape_stock.mjs

      - name: Commit changed stock data
        run: |
          git config user.name "stock-bot"
          git config user.email "stock-bot@users.noreply.github.com"
          git add data/stock.json
          git diff --cached --quiet || git commit -m "Update stock"
          git push
